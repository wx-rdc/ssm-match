# miniImageNet 5-way 1-shot（论文协议：AdamW 1e-4 / 余弦退火 / 200 epochs / batch 4 episodes）
seed: 42
n_way: 5
k_shot: 1
n_query: 15
episodes_per_epoch: 100
batch_episodes: 4
epochs: 200
lr: 1.0e-4
weight_decay: 1.0e-4
aux_weight: 0.1
query_chunk: 10        # 1-shot 序列短，可用较大分块
num_workers: 8
val_episodes: 200
eval_every: 10
vim_ckpt: vim_t_midclstok_ft_78p3acc.pth
